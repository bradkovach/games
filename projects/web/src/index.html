<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Acquire</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- The app ships its own dark theme. -->
    <meta name="darkreader-lock" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply the saved theme before first paint (see ThemeService).
      try {
        var theme = localStorage.getItem('acquire.theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
